# scikit-build-core-conan wraps scikit-build-core: it runs `conan install`
# (resolving conanfile.txt, auto-detecting a profile if needed) and passes the
# generated toolchain to CMake, so `pip install .` needs no manual Conan setup.
[build-system]
requires = ["scikit-build-core-conan>=0.6", "pybind11>=2.12"]
build-backend = "scikit_build_core_conan.build"

[project]
name = "wavo"
version = "0.1.0"
description = "Fourier-based visual odometry"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Pedro", email = "pedro.fontana.1996@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "pydantic>=2",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
test = ["pytest"]
# The editable rebuild-on-import re-runs CMake outside pip's isolated build
# env, so the build tooling must live in the dev venv (install with
# --no-build-isolation, see README).
dev = [
  "pytest",
  "pre-commit",
  "black",
  "ninja",
  "pybind11>=2.12",
  "scikit-build-core-conan>=0.6",
]

# Persistent Conan output folder: the generated toolchain must outlive the
# build so editable rebuilds-on-import can re-run CMake.
[tool.scikit-build-core-conan]
output-folder = "build/conan"

# In-repo recipes exported to the Conan cache before `conan install`
# (Open3D has no Conan Center package).
[[tool.scikit-build-core-conan.local-recipes]]
path = "conan/open3d"
name = "open3d"
version = "0.19.0"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/wavo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py39"]
